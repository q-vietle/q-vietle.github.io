<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- propeller -->
  <rect x="1.8" y="15.2" width="2.4" height="5.6" rx="1.2" fill="#5b7386" stroke="#0a141d" stroke-width="1"/>
  <path d="M3 15 L1.6 12.4 M3 21 L1.6 23.6" stroke="#0a141d" stroke-width="1.8" stroke-linecap="round"/>
  <!-- tail fin -->
  <path d="M6.5 14 L4.2 10.4 L10 12.6Z" fill="#ff9a1a" stroke="#0a141d" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- periscope -->
  <path d="M17 10 V5 H21.5" fill="none" stroke="#0a141d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M17 10 V5 H21.5" fill="none" stroke="#9fb8c9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- sonar ping from the periscope -->
  <g fill="none" stroke="#0a141d" stroke-width="2.6" stroke-linecap="round">
    <path d="M23.75 1.97 A3.5 3.5 0 0 1 23.75 8.03"/>
    <path d="M27.3 1.6 A6.5 6.5 0 0 1 27.3 8.4"/>
  </g>
  <g fill="none" stroke="#19d3ff" stroke-width="1.4" stroke-linecap="round">
    <path d="M23.75 1.97 A3.5 3.5 0 0 1 23.75 8.03"/>
    <path d="M27.3 1.6 A6.5 6.5 0 0 1 27.3 8.4"/>
  </g>
  <!-- conning tower -->
  <path d="M12 12.6 L13.6 8.6 H19.6 L21.2 12.6Z" fill="#ffcf3a" stroke="#0a141d" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- hull -->
  <rect x="4" y="12" width="24" height="12" rx="6" fill="#ffcf3a" stroke="#0a141d" stroke-width="1.5"/>
  <path d="M9 14.4 H22" stroke="#fff" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M8 21.8 H24" stroke="#d99a00" stroke-width="1.2" stroke-linecap="round"/>
  <!-- glowing portholes -->
  <g fill="#19d3ff" stroke="#0a141d" stroke-width="1">
    <circle cx="10" cy="18" r="2.2"/>
    <circle cx="16" cy="18" r="2.2"/>
    <circle cx="22" cy="18" r="2.2"/>
  </g>
  <g fill="#fff" fill-opacity=".85">
    <circle cx="9.3" cy="17.3" r=".6"/>
    <circle cx="15.3" cy="17.3" r=".6"/>
    <circle cx="21.3" cy="17.3" r=".6"/>
  </g>
</svg>
